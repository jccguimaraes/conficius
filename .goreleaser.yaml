version: 2

project_name: conficius

builds:
  - id: conficius
    main: ./cmd/cli
    binary: conficius
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Env.CONFICIUS_VERSION}}

archives:
  - id: conficius
    ids:
      - conficius
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Env.CONFICIUS_VERSION }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: conficius
    ids:
      - conficius
    binaries:
      - conficius
    repository:
      owner: jccguimaraes
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://jccguimaraes.github.io/conficius"
    description: "Manage dotfiles and inspect installed packages"
    skip_upload: '{{ contains .Env.CONFICIUS_VERSION "-" }}'
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/conficius"]
          end
    caveats: |
      This binary is not signed or notarized by Apple.
      On macOS, installation removes quarantine from this binary, bypassing Gatekeeper.
      Install only if you trust this project's release artifacts.

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: "false"
  make_latest: auto
  name_template: "Conficius CLI {{.Env.CONFICIUS_VERSION}}"

changelog:
  disable: true

