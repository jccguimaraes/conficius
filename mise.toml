[tools]
actionlint = "1.7.12"
cinzel = "1.3.2"
ghalint = "1.5.6"
git-cliff = "2.14.2"
go = "1.27.2"
golangci-lint = "2.14.0"
goreleaser = "2.19.0"

[env]
COVERAGE_PATH="./coverage"
COVERAGE_REPORT_PATH="{{env.COVERAGE_PATH}}/coverage.out"
COVERAGE_HTML_PATH="{{env.COVERAGE_PATH}}/coverage.html"

[tasks.setup]
run = """
git config --local core.hooksPath ./.commitlint/hooks
chmod +x ./.commitlint/hooks/*
"""

[tasks.cli]
run = "go run ./cmd/cli/..."

[tasks.tui]
run = "go run ./cmd/tui/..."

[tasks.pkgsite]
run = "go tool pkgsite"

[tasks.lint]
run = "golangci-lint run"

[tasks.fmt]
run = """
go fmt ./...
"""

[tasks.build-cli]
depends = ["test-ci"]
run = """
VERSION="${VERSION:-$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')}"
VERSION="${VERSION#v}"
if [ -z "$VERSION" ]; then
  VERSION="dev-$(git rev-parse --short HEAD)"
fi
rm -rf ./bin
go build -ldflags "-s -w -X main.version=$VERSION" -o ./bin/conficius ./cmd/cli
"""

[tasks.build-tui]
depends = ["test-ci"]
run = """
VERSION="${VERSION:-dev-$(git rev-parse --short HEAD)}"
mkdir -p ./bin
go build -ldflags "-s -w -X main.version=$VERSION" -o ./bin/conficius-tui ./cmd/tui
"""

[tasks.release-check]
run = "goreleaser check && goreleaser check --config .goreleaser-tui.yaml"

[tasks.release-snapshot-cli]
env.CONFICIUS_VERSION = "dev"
run = "goreleaser release --snapshot --clean"

[tasks.release-snapshot-tui]
env.CONFICIUS_VERSION = "dev"
run = "goreleaser release --snapshot --clean --config .goreleaser-tui.yaml"

[tasks.release-cli]
run = '''
set -eu
: "${TAG:?Set TAG=cli-vX.Y.Z}"
case "$TAG" in cli-v*) ;; *) printf '%s\n' 'Expected CLI tag cli-vX.Y.Z' >&2; exit 1 ;; esac
gh workflow run release-cli.yml --ref "$TAG" -f confirm=publish
'''

[tasks.release-tui]
run = '''
set -eu
: "${TAG:?Set TAG=tui-vYYYY.MM.revision}"
case "$TAG" in tui-v*) ;; *) printf '%s\n' 'Expected TUI tag tui-vYYYY.MM.revision' >&2; exit 1 ;; esac
gh workflow run release-tui.yml --ref "$TAG" -f confirm=publish
'''

[tasks.changelog]
run = "git cliff --offline --output CHANGELOG.md"

[tasks.coverpath]
run = "mkdir -p ./coverage"

[tasks.test-ci]
run = "env -u CONFICIUS_DOTFILES_CONFIG -u CONFICIUS_PACKAGES_CONFIG -u CONFICIUS_PROFILE go test -race ./... --cover"

[tasks.smoke]
depends = ["build-cli"]
run = "./bin/conficius --help >/dev/null && ./bin/conficius packages pms --json >/dev/null"

[tasks.test]
depends = ["coverpath"]
run = "env -u CONFICIUS_DOTFILES_CONFIG -u CONFICIUS_PACKAGES_CONFIG -u CONFICIUS_PROFILE go test ./... --cover -coverprofile=${COVERAGE_REPORT_PATH}"

[tasks.report]
depends = ["test"]
run = "go tool cover -html=${COVERAGE_REPORT_PATH} -o ${COVERAGE_HTML_PATH}"

[tasks.license]
run = "go tool addlicense -v -ignore '**/*.yaml' -ignore '**/*.yml' -ignore '**/*.md' -l apache -s=only -c 'João Guimarães' ."

[tasks.license-check]
run = "go tool addlicense -check -ignore '**/*.yaml' -ignore '**/*.yml' -ignore '**/*.md' ."

[tasks.cinzel]
run = "go tool cinzel github parse"
