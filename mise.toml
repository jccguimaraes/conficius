[tools]
actionlint = "1.7.12"
cinzel = "1.4.0"
ghalint = "1.5.6"
git-cliff = "2.14.2"
go = "1.27.2"
golangci-lint = "2.14.0"
goreleaser = "2.19.0"
hk = "2.9.0"
pkl = "0.32.2"
gh = "2.103.3"

[env]
COVERAGE_PATH="./coverage"
COVERAGE_REPORT_PATH="{{env.COVERAGE_PATH}}/coverage.out"
COVERAGE_HTML_PATH="{{env.COVERAGE_PATH}}/coverage.html"

[tasks.setup]
run = """
if [ "$(git config --local --get core.hooksPath || true)" = "./.commitlint/hooks" ]; then
  git config --local --unset core.hooksPath
fi
hk install --mise
"""

[tasks.cli]
run = "go run ./cmd/cli/..."

[tasks.tui]
run = "go run ./cmd/tui/..."

[tasks.pkgsite]
run = "go tool pkgsite"

[tasks.lint]
run = "golangci-lint run"

[tasks.fmt]
run = """
go fmt ./...
"""

[tasks.build-cli]
depends = ["test-ci"]
run = """
VERSION="${VERSION:-$(git describe --tags --match 'cli-v*' --abbrev=0 2>/dev/null || true)}"
VERSION="${VERSION#cli-v}"
if [ -z "$VERSION" ]; then
  VERSION="dev-$(git rev-parse --short HEAD)"
fi
mkdir -p ./bin
go build -ldflags "-s -w -X main.version=$VERSION" -o ./bin/conficius ./cmd/cli
"""

[tasks.build-tui]
depends = ["test-ci"]
run = """
VERSION="${VERSION:-$(git describe --tags --match 'tui-v*' --abbrev=0 2>/dev/null || true)}"
VERSION="${VERSION#tui-v}"
VERSION="${VERSION:-dev-$(git rev-parse --short HEAD)}"
mkdir -p ./bin
go build -ldflags "-s -w -X main.version=$VERSION" -o ./bin/conficius-tui ./cmd/tui
"""

[tasks.release-check]
run = "goreleaser check && goreleaser check --config .goreleaser-tui.yaml"

[tasks.release-snapshot-cli]
env.CONFICIUS_VERSION = "dev"
run = "goreleaser release --snapshot --clean"

[tasks.release-snapshot-tui]
env.CONFICIUS_VERSION = "dev"
run = "goreleaser release --snapshot --clean --config .goreleaser-tui.yaml"

[tasks.release-cli]
run = '''
set -eu
VERSION="${VERSION:-$(awk '/^## \[/ {sub(/^## \[/, ""); sub(/\].*/, ""); print; exit}' CHANGELOG.md)}"
: "${VERSION:?Prepare CLI changelog first}"
gh workflow run release.yml --ref main -f product=cli -f version="$VERSION" -f sha="$(git rev-parse HEAD)"
'''

[tasks.release-tui]
run = '''
set -eu
VERSION="${VERSION:-$(awk '/^## \[/ {sub(/^## \[/, ""); sub(/\].*/, ""); print; exit}' CHANGELOG-TUI.md)}"
: "${VERSION:?Prepare TUI changelog first}"
gh workflow run release.yml --ref main -f product=tui -f version="$VERSION" -f sha="$(git rev-parse HEAD)"
'''

[tasks.next-version]
run = '''
set -eu
if [ -n "${VERSION:-}" ]; then printf '%s\n' "$VERSION"; exit; fi
case "${PRODUCT:?Set PRODUCT=cli or tui}" in
  cli)
    version=$(git cliff --offline --no-exec --use-branch-tags --tag-pattern '^cli-v' --skip-tags '^$' --ignore-tags '^$' --include-path 'cmd/cli/**' --include-path 'internal/**' --include-path go.mod --include-path go.sum --include-path .goreleaser.yaml --bumped-version)
    printf '%s\n' "${version#cli-v}"
    ;;
  tui)
    month=$(date -u +%Y.%m)
    revision=$(git tag --list "tui-v$month.*" | awk -F. '$3 ~ /^[1-9][0-9]*$/ && $3+0 > max {max=$3+0} END {printf "%.0f", max+1}')
    printf '%s.%s\n' "$month" "$revision"
    ;;
  *) exit 1 ;;
esac
'''

[tasks.changelog]
run = '''
set -eu
VERSION="${VERSION:-$(mise run --quiet next-version)}"
export VERSION
case "${PRODUCT:?Set PRODUCT=cli or tui}" in
  cli) changelog=CHANGELOG.md ;;
  tui) changelog=CHANGELOG-TUI.md ;;
  *) exit 1 ;;
esac
if grep -Fq "## [$VERSION]" "$changelog"; then
  printf '%s\n' "Changelog already contains $VERSION" >&2
  exit 1
fi
mise run release-notes -- --prepend "$changelog"
'''

[tasks.release-notes]
run = '''
set -eu
VERSION="${VERSION:-$(mise run --quiet next-version)}"
case "${PRODUCT:?Set PRODUCT=cli or tui}" in
  cli) config=.goreleaser.yaml ;;
  tui) config=.goreleaser-tui.yaml ;;
  *) exit 1 ;;
esac
sha="${SHA:-HEAD}"
previous=$(git describe --tags --match "$PRODUCT-v*" --abbrev=0 "$sha" 2>/dev/null || true)
range="$sha"
if [ -n "$previous" ]; then range="$previous..$sha"; fi
git cliff --offline --no-exec --tag-pattern "^$PRODUCT-v" --skip-tags '^$' --ignore-tags '^$' --tag "$PRODUCT-v$VERSION" --strip all --include-path "cmd/$PRODUCT/**" --include-path 'internal/**' --include-path go.mod --include-path go.sum --include-path "$config" "$range" "$@"
'''

[tasks.check-release-versions]
run = '''
set -eu
[ "$(PRODUCT=cli VERSION=1.2.3 mise run --quiet next-version)" = 1.2.3 ]
[ "$(PRODUCT=tui VERSION=2026.12.9 mise run --quiet next-version)" = 2026.12.9 ]
for product in cli tui; do
  version=$(PRODUCT="$product" mise run --quiet next-version)
  case "$product" in
    cli) printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' ;;
    tui) printf '%s\n' "$version" | grep -Eq "^$(date -u +%Y.%m)\.[1-9][0-9]*$" ;;
  esac
  PRODUCT="$product" VERSION="$version" mise run --quiet release-notes | grep -F "## [$version]"
done
'''

[tasks.coverpath]
run = "mkdir -p ./coverage"

[tasks.test-ci]
run = "env -u CONFICIUS_DOTFILES_CONFIG -u CONFICIUS_PACKAGES_CONFIG -u CONFICIUS_PROFILE go test -race ./... --cover"

[tasks.smoke]
depends = ["build-cli"]
run = "./bin/conficius --help >/dev/null && ./bin/conficius packages pms --json >/dev/null"

[tasks.test]
depends = ["coverpath"]
run = "env -u CONFICIUS_DOTFILES_CONFIG -u CONFICIUS_PACKAGES_CONFIG -u CONFICIUS_PROFILE go test ./... --cover -coverprofile=${COVERAGE_REPORT_PATH}"

[tasks.report]
depends = ["test"]
run = "go tool cover -html=${COVERAGE_REPORT_PATH} -o ${COVERAGE_HTML_PATH}"

[tasks.license]
run = "go tool addlicense -v -ignore '**/*.yaml' -ignore '**/*.yml' -ignore '**/*.md' -l apache -s=only -c 'João Guimarães' ."

[tasks.license-check]
run = "go tool addlicense -check -ignore '**/*.yaml' -ignore '**/*.yml' -ignore '**/*.md' ."

[tasks.cinzel]
run = "cinzel github parse"

[tasks.check]
run = "hk check --all"
