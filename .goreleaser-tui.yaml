version: 2

project_name: conficius-tui

builds:
  - id: conficius-tui
    main: ./cmd/tui
    binary: conficius-tui
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Env.CONFICIUS_VERSION}}

archives:
  - id: conficius-tui
    ids:
      - conficius-tui
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Env.CONFICIUS_VERSION }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: conficius-tui
    ids:
      - conficius-tui
    binaries:
      - conficius-tui
    repository:
      owner: jccguimaraes
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://jccguimaraes.github.io/conficius"
    description: "Manage dotfiles and inspect installed packages"
    skip_upload: '{{ contains .Env.CONFICIUS_VERSION "-" }}'
    caveats: |
      This binary is not signed or notarized by Apple. macOS Gatekeeper may block execution.
      Install only if you trust this project's release artifacts.

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: "false"
  make_latest: "false"
  name_template: "Conficius TUI {{.Env.CONFICIUS_VERSION}}"

changelog:
  disable: true
