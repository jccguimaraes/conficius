# generated-by: cinzel
# cinzel-provider: github
# cinzel-source: cinzel/ci.hcl
name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
jobs:
  test:
    name: "Test (${{ matrix.os }})"
    permissions:
      contents: read
    runs-on: "${{ matrix.os }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          go build -o ./bin/conficius ./cmd/cli
          go build -o ./bin/conficius-tui ./cmd/tui
      - name: Smoke test
        run: |
          ./bin/conficius --help >/dev/null
          ./bin/conficius packages pms --json >/dev/null
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    timeout-minutes: 15
  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: golangci-lint goreleaser
      - name: Lint Go
        run: golangci-lint run
      - name: Check GoReleaser
        run: |
          goreleaser check
          goreleaser check --config .goreleaser-tui.yaml
    timeout-minutes: 15
