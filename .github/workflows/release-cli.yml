# generated-by: cinzel
# cinzel-provider: github
# cinzel-source: cinzel/release-cli.hcl
name: Release CLI
on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      confirm:
        default: verify
        description: Type "publish" to release selected tag
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Verify CLI release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          TAG: "${{ github.ref_name }}"
        name: Validate release tag
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^cli-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "invalid CLI release tag: $TAG" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=${TAG#cli-v}
          grep -Fqx "## [$version]" CHANGELOG.md
          echo "CONFICIUS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Build snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: build --snapshot --clean
          distribution: goreleaser
          version: v2.18.1
    timeout-minutes: 15
  publish:
    if: "github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'cli-v') && inputs.confirm == 'publish'"
    name: Publish CLI release
    needs:
      - verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          TAG: "${{ github.ref_name }}"
        name: Set release version
        run: "echo \"CONFICIUS_VERSION=${TAG#cli-v}\" >> \"$GITHUB_ENV\""
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GORELEASER_CURRENT_TAG: "${{ github.ref_name }}"
        name: Publish with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean --skip=validate
          distribution: goreleaser
          version: v2.18.1
    timeout-minutes: 15
