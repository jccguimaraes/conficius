# generated-by: cinzel
# cinzel-provider: github
# cinzel-source: cinzel/release.hcl

name: Release CLI/TUI
run-name: Release ${{ inputs.product == 'cli' && 'CLI' || 'TUI' }} ${{ inputs.version || '(automatic version)' }}
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to publish
        options:
          - cli
          - tui
        required: true
        type: choice
      version:
        description: Optional version override; leave blank to calculate
        required: false
        type: string
permissions:
  contents: read
concurrency:
  cancel-in-progress: false
  group: release-publishing
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Verify ${{ inputs.product == 'cli' && 'CLI' || 'TUI' }} release
    outputs:
      config: ${{ steps.validate.outputs.config }}
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - env:
          SHA: ${{ github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$SHA^{commit}")" ]
          git merge-base --is-ancestor "$SHA" origin/main
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          install_args: go goreleaser git-cliff cinzel hk pkl actionlint ghalint gh
      - env:
          PRODUCT: ${{ inputs.product }}
          SELECTION: ${{ inputs.version && 'manual override' || 'automatic' }}
          SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        id: validate
        run: |
          VERSION="$(VERSION="$VERSION" mise run --quiet next-version)"
          case "$PRODUCT" in
            cli)
              [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]
              config=.goreleaser.yaml
              ;;
            tui)
              [[ "$VERSION" =~ ^20[0-9]{2}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]
              config=.goreleaser-tui.yaml
              ;;
            *) exit 1 ;;
          esac
          tag="$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            printf '%s\n' "Tag already exists: $tag; inspect partial releases before recovery" >&2
            exit 1
          fi
          printf 'tag=%s\nconfig=%s\nversion=%s\n' "$tag" "$config" "$VERSION" >> "$GITHUB_OUTPUT"
          printf '## Release %s %s\n\n- Tag: %s\n- Commit: %s\n- Version selection: %s\n' "$PRODUCT" "$VERSION" "$tag" "$SHA" "$SELECTION" >> "$GITHUB_STEP_SUMMARY"
      - run: mise run test-ci && mise run check && mise run release-check
      - env:
          CONFICIUS_VERSION: ${{ steps.validate.outputs.version }}
          CONFIG: ${{ steps.validate.outputs.config }}
        run: goreleaser release --snapshot --clean --config "$CONFIG"
    timeout-minutes: 20
  publish:
    environment:
      name: release
    name: Publish ${{ inputs.product == 'cli' && 'CLI' || 'TUI' }} ${{ needs.verify.outputs.version }}
    needs:
      - verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - env:
          SHA: ${{ github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$SHA^{commit}")" ]
          git merge-base --is-ancestor "$SHA" origin/main
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          install_args: go goreleaser git-cliff cinzel hk pkl actionlint ghalint gh
      - env:
          PRODUCT: ${{ inputs.product }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: mise run release-notes > /tmp/release-notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" && git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
      - env:
          CONFICIUS_VERSION: ${{ needs.verify.outputs.version }}
          CONFIG: ${{ needs.verify.outputs.config }}
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.verify.outputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          case "$CONFICIUS_VERSION" in
            *-*) sed 's/prerelease: "false"/prerelease: "true"/' "$CONFIG" > /tmp/goreleaser.yaml; CONFIG=/tmp/goreleaser.yaml ;;
          esac
          goreleaser release --clean --skip=validate --config "$CONFIG" --release-notes /tmp/release-notes.md
      - env:
          PRODUCT: ${{ inputs.product == 'cli' && 'CLI' || 'TUI' }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        if: always()
        name: Release summary and changelog
        run: |
          {
            printf '## Release %s %s\n\n' "$PRODUCT" "$VERSION"
            printf -- '- Status: **%s**\n- Tag: %s\n- Commit: %s\n' "$STATUS" "$TAG" "$SHA"
            if [ "$STATUS" = success ]; then
              printf -- '- Release: [%s](%s/%s/releases/tag/%s)\n' "$TAG" "$SERVER" "$REPOSITORY" "$TAG"
            fi
            if [ -f /tmp/release-notes.md ]; then
              printf '\n<details><summary>Changelog</summary>\n\n'
              cat /tmp/release-notes.md
              printf '\n</details>\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
    timeout-minutes: 20
