# generated-by: cinzel
# cinzel-provider: github
# cinzel-source: cinzel/release.hcl

name: Release
on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to publish
        options:
          - cli
          - tui
        required: true
        type: choice
      sha:
        description: Full commit SHA merged into main
        required: true
        type: string
      version:
        description: Version without product prefix
        required: true
        type: string
permissions:
  contents: read
concurrency:
  cancel-in-progress: false
  group: release-publishing
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    outputs:
      config: ${{ steps.validate.outputs.config }}
      tag: ${{ steps.validate.outputs.tag }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$SHA^{commit}")" ]
          git merge-base --is-ancestor "$SHA" origin/main
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          install_args: go goreleaser git-cliff cinzel hk pkl actionlint ghalint gh
      - env:
          PRODUCT: ${{ inputs.product }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        id: validate
        run: |
          case "$PRODUCT" in
            cli)
              [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]
              config=.goreleaser.yaml
              changelog=CHANGELOG.md
              ;;
            tui)
              [[ "$VERSION" =~ ^20[0-9]{2}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]
              config=.goreleaser-tui.yaml
              changelog=CHANGELOG-TUI.md
              ;;
            *) exit 1 ;;
          esac
          tag="$PRODUCT-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            printf '%s\n' "Tag already exists: $tag; inspect partial releases before recovery" >&2
            exit 1
          fi
          grep -F "## [$VERSION]" "$changelog" | grep -q '^## '
          printf 'tag=%s\nconfig=%s\n' "$tag" "$config" >> "$GITHUB_OUTPUT"
      - run: mise run test-ci && mise run check && mise run release-check
      - env:
          CONFICIUS_VERSION: ${{ inputs.version }}
          CONFIG: ${{ steps.validate.outputs.config }}
        run: goreleaser release --snapshot --clean --config "$CONFIG"
    timeout-minutes: 20
  publish:
    environment:
      name: release
    needs:
      - verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$SHA^{commit}")" ]
          git merge-base --is-ancestor "$SHA" origin/main
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          install_args: go goreleaser git-cliff cinzel hk pkl actionlint ghalint gh
      - env:
          PRODUCT: ${{ inputs.product }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        id: validate
        run: |
          case "$PRODUCT" in
            cli)
              [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]
              config=.goreleaser.yaml
              changelog=CHANGELOG.md
              ;;
            tui)
              [[ "$VERSION" =~ ^20[0-9]{2}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]
              config=.goreleaser-tui.yaml
              changelog=CHANGELOG-TUI.md
              ;;
            *) exit 1 ;;
          esac
          tag="$PRODUCT-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            printf '%s\n' "Tag already exists: $tag; inspect partial releases before recovery" >&2
            exit 1
          fi
          grep -F "## [$VERSION]" "$changelog" | grep -q '^## '
          printf 'tag=%s\nconfig=%s\n' "$tag" "$config" >> "$GITHUB_OUTPUT"
      - env:
          PRODUCT: ${{ inputs.product }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
        run: mise run release-notes > /tmp/release-notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" && git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
      - env:
          CONFICIUS_VERSION: ${{ inputs.version }}
          CONFIG: ${{ needs.verify.outputs.config }}
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ needs.verify.outputs.tag }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          case "$CONFICIUS_VERSION" in
            *-*) sed 's/prerelease: "false"/prerelease: "true"/' "$CONFIG" > /tmp/goreleaser.yaml; CONFIG=/tmp/goreleaser.yaml ;;
          esac
          goreleaser release --clean --skip=validate --config "$CONFIG" --release-notes /tmp/release-notes.md
    timeout-minutes: 20
