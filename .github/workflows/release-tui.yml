# generated-by: cinzel
# cinzel-provider: github
# cinzel-source: cinzel/release-tui.hcl
name: Release TUI
on:
  push:
    tags:
      - "tui-v*"
  workflow_dispatch:
    inputs:
      confirm:
        default: verify
        description: Type "publish" to release selected tag
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Verify TUI release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          TAG: "${{ github.ref_name }}"
        name: Validate release tag
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^tui-v(20[0-9]{2})\.(0[1-9]|1[0-2])\.([1-9][0-9]*)$'; then
            echo "invalid TUI release tag: $TAG" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "CONFICIUS_VERSION=${TAG#tui-v}" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Build snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: build --snapshot --clean --config .goreleaser-tui.yaml
          distribution: goreleaser
          version: v2.18.1
    timeout-minutes: 15
  publish:
    if: "github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'tui-v') && inputs.confirm == 'publish'"
    name: Publish TUI release
    needs:
      - verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          TAG: "${{ github.ref_name }}"
        name: Set release version
        run: "echo \"CONFICIUS_VERSION=${TAG#tui-v}\" >> \"$GITHUB_ENV\""
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GORELEASER_CURRENT_TAG: "${{ github.ref_name }}"
        name: Publish with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --skip=validate --config .goreleaser-tui.yaml
          distribution: goreleaser
          version: v2.18.1
    timeout-minutes: 15
